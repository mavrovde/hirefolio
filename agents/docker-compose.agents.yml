# Generated from agents/common/roster.py — the A2A agent team.
# Run:  docker compose -f agents/docker-compose.agents.yml up --build
# Brain: defaults to Claude (A2A_LLM_PROVIDER=anthropic, A2A_MODEL=claude-sonnet-4-6,
# prompt caching on) — export ANTHROPIC_API_KEY (or put it in the repo-root .env).
# Override with A2A_LLM_PROVIDER=ollama + OLLAMA_URL to run local/free instead
# (host-native Ollama via host.docker.internal; on Apple silicon run it NATIVELY).
services:
  project-manager:
    build: { context: ., dockerfile: Dockerfile }
    command: ["python", "-m", "agents.serve", "project-manager"]
    environment:
      - A2A_DOCKER=1
      - A2A_PORT=8010
      - A2A_LLM_PROVIDER=${A2A_LLM_PROVIDER:-anthropic}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - A2A_MODEL=${A2A_MODEL:-claude-sonnet-4-6}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8010:8010"
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [a2a-net]
