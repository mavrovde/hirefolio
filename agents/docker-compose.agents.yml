# Generated from agents/common/roster.py — the A2A agent team.
# Run:  docker compose -f agents/docker-compose.agents.yml up --build
# Each agent serves its Agent Card at /.well-known/agent.json on its port.
services:
  project-manager:
    build: { context: ., dockerfile: Dockerfile }
    command: ["python", "-m", "agents.serve", "project-manager"]
    environment:
      - A2A_DOCKER=1
      - A2A_PORT=8010
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - A2A_MODEL=${A2A_MODEL:-claude-opus-4-8}
    ports:
      - "8010:8010"
    networks: [a2a-net]
