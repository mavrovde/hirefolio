services:
  backend:
    build: ./backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

  admin-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.admin

  proxy:
    build: ./proxy
    environment:
      # E2E only: admin traffic arrives from the Docker bridge gateway (not loopback),
      # so open the allowlist for the test run. Production ships closed by default.
      - ADMIN_ALLOWED_CIDRS=0.0.0.0/0
