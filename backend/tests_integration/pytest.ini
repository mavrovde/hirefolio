# Own rootdir on purpose: the backend unit run's pyproject addopts (coverage,
# --cov-fail-under=100) must NOT apply to the black-box tier — these tests
# measure the composed SYSTEM, not line coverage of app/. Run from this
# directory (run_integration_tests.sh does).
[pytest]
addopts = -q --strict-markers
markers =
    faults: fault-injection cases that exercise WireMock delay/error mappings
