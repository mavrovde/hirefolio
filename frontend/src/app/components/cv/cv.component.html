<div class="bg-black min-h-screen text-primary font-mono">
    <app-header></app-header>
    <div class="cv-container fade-in">
        <div class="card">
            <h2>{{ 'CV.TITLE' | translate }}</h2>
            <p class="subtitle">{{ 'CV.SUBTITLE' | translate }}</p>

            <div *ngIf="successMessage" class="alert success">
                {{ 'CV.SUCCESS' | translate }}
            </div>

            <div *ngIf="errorMessage" class="alert error">
                {{ 'CV.ERROR_SUBMIT' | translate }}
            </div>

            <form [formGroup]="cvForm" (ngSubmit)="onSubmit()" *ngIf="!successMessage">
                <div class="form-group">
                    <label for="name">{{ 'CV.NAME' | translate }} <span class="required">*</span></label>
                    <input type="text" id="name" formControlName="name"
                        [placeholder]="'CV.NAME_PLACEHOLDER' | translate"
                        [class.invalid]="cvForm.get('name')?.invalid && cvForm.get('name')?.touched">
                    <div class="error-msg" *ngIf="cvForm.get('name')?.invalid && cvForm.get('name')?.touched">
                        {{ 'CV.NAME_ERROR' | translate }}
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">{{ 'CV.EMAIL' | translate }} <span class="required">*</span></label>
                    <input type="email" id="email" formControlName="email"
                        [placeholder]="'CV.EMAIL_PLACEHOLDER' | translate"
                        [class.invalid]="cvForm.get('email')?.invalid && cvForm.get('email')?.touched">
                    <div class="error-msg" *ngIf="cvForm.get('email')?.invalid && cvForm.get('email')?.touched">
                        {{ 'CV.EMAIL_ERROR' | translate }}
                    </div>
                </div>

                <div class="form-group">
                    <label for="company">{{ 'CV.COMPANY' | translate }}</label>
                    <input type="text" id="company" formControlName="company"
                        [placeholder]="'CV.COMPANY_PLACEHOLDER' | translate">
                </div>

                <div class="form-group">
                    <label for="message">{{ 'CV.MESSAGE' | translate }} <span class="required">*</span></label>
                    <textarea id="message" formControlName="message" rows="4"
                        [placeholder]="'CV.MESSAGE_PLACEHOLDER' | translate"
                        [class.invalid]="cvForm.get('message')?.invalid && cvForm.get('message')?.touched"></textarea>
                    <div class="error-msg" *ngIf="cvForm.get('message')?.invalid && cvForm.get('message')?.touched">
                        {{ 'CV.MESSAGE_ERROR' | translate }}
                    </div>
                </div>



                <button type="submit" class="btn-primary" [disabled]="cvForm.invalid || isLoading">
                    <span *ngIf="isLoading" class="spinner"></span>
                    <span *ngIf="!isLoading">{{ 'CV.SUBMIT' | translate }}</span>
                </button>
            </form>

            <div *ngIf="successMessage" class="post-success-actions">
                <p>{{ 'CV.SUCCESS' | translate }}</p>
                <button class="btn-secondary" (click)="successMessage = null">{{ 'CV.REQUEST_AGAIN' | translate
                    }}</button>
            </div>
        </div>
    </div>
</div>
