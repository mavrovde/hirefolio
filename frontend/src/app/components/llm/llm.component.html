<div [class.bg-black]="standalone" [class.min-h-screen]="standalone">
    <app-header *ngIf="standalone"></app-header>
    <div class="terminal-container font-mono text-sm md:text-base p-4 bg-black text-terminal-dim flex flex-col"
        (click)="focusInput()">
        <!-- Header -->
        <div
            class="mb-4 text-secondary border-b border-dashed border-terminal-dim pb-2 flex justify-between items-center">
            <div>
                <a routerLink="/" class="text-primary hover:text-white transition-colors mr-2">&gt;_ SM</a>
                <h1 class="text-terminal-highlight inline-block text-sm md:text-base font-normal">user@mavrov</h1>
                :~/llm$ ./chat
            </div>
        </div>

        <!-- History and Unified Input -->
        <div class="flex-grow overflow-y-auto mb-4" #scrollContainer>
            <div *ngFor="let msg of messages" class="message mb-4">
                <div *ngIf="msg.role === 'user'" class="text-primary">
                    <span class="text-terminal-highlight">user@mavrov:~/llm$</span> {{ msg.content }}
                </div>
                <div *ngIf="msg.role === 'assistant'"
                    class="text-secondary pl-4 border-l border-terminal-dim ml-1 whitespace-pre-wrap">
                    {{ msg.content }}
                </div>
                <div *ngIf="msg.role === 'system'" class="text-terminal-dim italic text-xs">
                    # {{ msg.content }}
                </div>
            </div>

            <!-- Thinking Indicator -->
            <div *ngIf="isThinking" class="text-terminal-dim pl-4 animate-pulse mb-4">
                _ generating response...
            </div>

            <!-- Inline Input Area -->
            <div class="flex items-center gap-2" *ngIf="!isThinking">
                <span class="text-terminal-highlight whitespace-nowrap">user@mavrov:~/llm$</span>
                <input type="text" [(ngModel)]="userInput" (keydown.enter)="sendMessage()"
                    class="flex-grow bg-transparent border-none outline-none text-primary placeholder-transparent focus:ring-0 p-0 m-0"
                    autofocus #terminalInput>
                <span class="animate-pulse text-primary terminal-cursor" *ngIf="userInput.length === 0">_</span>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="text-[10px] text-terminal-dim border-t border-dashed border-terminal-dim pt-2 mt-auto">
            Type 'clear' to reset or 'exit' to return. Connects to local Ollama.
        </div>
    </div>
</div>
