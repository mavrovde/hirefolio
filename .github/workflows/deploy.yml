name: Prod Deployment

on:
  push:
    branches: [main]

env:
  # Container registry + image org/name. Defaults keep the canonical repo publishing
  # to ghcr.io/<owner>/<repo>. A forker overrides these via repository variables
  # (Settings → Secrets and variables → Actions → Variables): set REGISTRY and/or
  # IMAGE_NAME to retarget the publish without editing this workflow.
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # ============================================
  # BACKEND QA
  # ============================================
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          bash scripts/patch_linkedin.sh
          pip install -r requirements-dev.txt
      - name: Run Ruff (lint)
        working-directory: ./backend
        run: ruff check . --output-format=github
      - name: Run Ruff (format check)
        working-directory: ./backend
        run: ruff format . --check

  backend-type-check:
    name: Backend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          bash scripts/patch_linkedin.sh
          pip install -r requirements-dev.txt
      - name: Run MyPy
        working-directory: ./backend
        run: mypy app --ignore-missing-imports --no-error-summary

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          bash scripts/patch_linkedin.sh
          pip install -r requirements-dev.txt
      - name: Run Bandit (security)
        working-directory: ./backend
        run: bandit -r app -ll --skip B101

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-type-check, backend-security]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_mavrov
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          bash scripts/patch_linkedin.sh
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_mavrov
          SECRET_KEY: test-secret-key-for-ci
          OLLAMA_BASE_URL: http://localhost:11434
        run: |
          pytest -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./backend/coverage.xml
          flags: backend

  backend-migrations:
    name: Backend Migrations (drift guard)
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-type-check, backend-security]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mavrov_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          bash scripts/patch_linkedin.sh
          pip install -r requirements-dev.txt
      - name: Create a second database (to simulate the pre-Alembic prod state)
        working-directory: ./backend
        run: |
          python -c "
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect(
                  'postgresql://postgres:postgres@localhost:5432/mavrov_migrations'
              )
              await conn.execute('CREATE DATABASE mavrov_migrations_pre')
              await conn.close()

          asyncio.run(main())
          "
      - name: Simulate today's prod DB (tables via create_all, no alembic_version)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mavrov_migrations_pre
          SECRET_KEY: test-secret-key-for-ci
        run: |
          python -c "
          import asyncio
          import app.models  # noqa: F401
          from app.database import Base, engine
          from sqlalchemy import text

          async def create():
              async with engine.begin() as conn:
                  await conn.execute(text('CREATE EXTENSION IF NOT EXISTS vector'))
                  await conn.run_sync(Base.metadata.create_all)
              await engine.dispose()

          asyncio.run(create())
          "
      - name: Self-adopt the pre-Alembic DB via the real entrypoint (must NOT crash)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mavrov_migrations_pre
          SECRET_KEY: test-secret-key-for-ci
        run: ./docker-entrypoint.sh true
      - name: Verify the pre-Alembic DB is now stamped at head
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mavrov_migrations_pre
          SECRET_KEY: test-secret-key-for-ci
        run: alembic current | grep -q "(head)"
      - name: Re-run entrypoint on the now-managed pre-Alembic DB (idempotent)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mavrov_migrations_pre
          SECRET_KEY: test-secret-key-for-ci
        run: ./docker-entrypoint.sh true
      - name: Self-adopt a fresh, empty DB via the real entrypoint
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mavrov_migrations
          SECRET_KEY: test-secret-key-for-ci
        run: ./docker-entrypoint.sh true
      - name: Re-run entrypoint on the now-managed fresh DB (idempotent)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mavrov_migrations
          SECRET_KEY: test-secret-key-for-ci
        run: ./docker-entrypoint.sh true
      - name: Drift guard (models vs. migrations must match exactly)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mavrov_migrations
          SECRET_KEY: test-secret-key-for-ci
        run: alembic check
  # ============================================
  # FRONTEND QA
  # ============================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint --if-present

  # --- Frontend unit tests, one job per workspace project (parallel, legible per-app) ---
  frontend-shared-tests:
    name: Frontend Tests · Shared Library
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps
      - name: Test shared library (100% coverage)
        working-directory: ./frontend
        run: npm run test:coverage:shared
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./frontend/coverage/shared/lcov.info
          flags: frontend-shared
          fail_ci_if_error: false

  frontend-public-tests:
    name: Frontend Tests · Public App (SSR)
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps
      - name: Test public app (100% coverage)
        working-directory: ./frontend
        run: npm run test:coverage:public
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./frontend/coverage/public/lcov.info
          flags: frontend-public
          fail_ci_if_error: false

  frontend-admin-tests:
    name: Frontend Tests · Admin App (SPA)
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps
      - name: Test admin app (100% coverage)
        working-directory: ./frontend
        run: npm run test:coverage:admin
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./frontend/coverage/admin/lcov.info
          flags: frontend-admin
          fail_ci_if_error: false

  # ============================================
  # PROXY QA
  # ============================================
  proxy-config-audit:
    name: Proxy Config Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for forbidden legacy configurations
        run: |
          if grep -iE "roundcube|mailserver|webmail" proxy/default.conf.template; then
            echo "Error: Forbidden legacy configuration (roundcube/mailserver/webmail) found in proxy/default.conf.template"
            exit 1
          fi
          echo "Proxy config is clean of legacy terms."

  # ============================================
  # BUILD ARTIFACTS (Parallel Builds)
  # ============================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [backend-tests, backend-migrations]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Public Frontend Image
    runs-on: ubuntu-latest
    needs: [frontend-shared-tests, frontend-public-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build & Push Frontend (public SSR app)
      - name: Build and Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-admin-frontend:
    name: Build Admin Frontend Image
    runs-on: ubuntu-latest
    needs: [frontend-shared-tests, frontend-admin-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build & Push Admin Frontend (CSR-only SPA)
      - name: Build and Push Admin Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.admin
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-admin-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-proxy:
    name: Build Proxy Image
    runs-on: ubuntu-latest
    needs: [proxy-config-audit]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # Build & Push Proxy
      - name: Build and Push Proxy
        uses: docker/build-push-action@v7
        with:
          context: ./proxy
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-proxy:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # E2E TESTS (Test What You Fly)
  # ============================================
  e2e-tests:
    name: E2E Tests (Docker Stack)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-admin-frontend, build-proxy]
    # Pin the Compose project name so the ollama data volume is deterministically
    # named `mavrov_ollama_data` across every `docker compose` step in this job.
    # The Ollama model-weights cache (below) pre-populates / snapshots exactly that
    # volume, so the name must be stable and match what Compose uses.
    env:
      COMPOSE_PROJECT_NAME: mavrov
    steps:
      - uses: actions/checkout@v7

      - name: Map admin.localhost to loopback (admin E2E)
        run: echo "127.0.0.1 admin.localhost" | sudo tee -a /etc/hosts

      - name: Prune Pre-Run (Free Space)
        run: |
          docker system prune -a -f --volumes
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Ollama model-weights cache (#78) ------------------------------------
      # The largest remaining uncached runtime download: the ollama service pulls
      # the embedding + generation model weights (nomic-embed-text, llama3.2,
      # llama3.2:1b — see .github/ollama-models.txt) into its data volume on every
      # run. We snapshot that volume to a tarball and cache it, keyed on the model
      # list + the pinned ollama image (base-images.txt). On a HIT we pre-load the
      # volume before the stack starts, so the ollama container finds the blobs
      # already present and skips the pull entirely; on a MISS we let it pull as
      # today, then snapshot the volume so the next run is a hit.
      - name: Restore cached Ollama model weights
        id: cache-ollama-models
        uses: actions/cache@v6
        with:
          path: /tmp/ollama-models
          key: ollama-models-${{ hashFiles('.github/ollama-models.txt', '.github/base-images.txt') }}

      - name: Pre-load Ollama models into volume (cache hit)
        if: steps.cache-ollama-models.outputs.cache-hit == 'true'
        run: |
          set -eo pipefail
          echo "Cache hit — restoring Ollama model weights into ${COMPOSE_PROJECT_NAME}_ollama_data (no pull):"
          cat .github/ollama-models.txt | grep -vE '^\s*#|^\s*$'
          # Create the (empty) named volume Compose will reuse, then extract the
          # cached blobs into it before the stack starts.
          docker volume create "${COMPOSE_PROJECT_NAME}_ollama_data" >/dev/null
          docker run --rm \
            -v "${COMPOSE_PROJECT_NAME}_ollama_data":/root/.ollama \
            -v /tmp/ollama-models:/backup \
            alpine sh -c 'cd /root/.ollama && tar xf /backup/ollama-models.tar'

      - name: Start Full Stack (Prod Topology)
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mavrov
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: sha-${{ github.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Start stack
          docker compose -f docker-compose.prod.yml up -d

      - name: Set up Node.js (for Playwright)
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps

      - name: Get installed Playwright version
        id: playwright-version
        working-directory: ./frontend
        run: |
          PW_VERSION=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)
          echo "version=$PW_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v6
        with:
          path: ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Restore cached base images
        id: cache-base-images
        uses: actions/cache@v6
        with:
          path: /tmp/base-images
          key: base-images-${{ hashFiles('.github/base-images.txt') }}

      - name: Load or pull base images
        run: |
          set -eo pipefail
          mkdir -p /tmp/base-images
          TAR=/tmp/base-images/images.tar
          IMAGES="$(grep -vE '^\s*#|^\s*$' .github/base-images.txt)"
          if [ -f "$TAR" ]; then
            echo "Cache hit — loading pinned base images from tarball (no pull):"
            echo "$IMAGES"
            docker load -i "$TAR"
          else
            echo "Cache miss — pulling pinned base images:"
            echo "$IMAGES"
            for img in $IMAGES; do docker pull "$img"; done
            docker save $IMAGES -o "$TAR"
          fi

      - name: Wait for Stack Ready
        run: |
          echo "Waiting for proxy to respond on port 80..."
          timeout 60s bash -c 'until curl -s -o /dev/null -w "%{http_code}" http://localhost:80 | grep "200\|302"; do sleep 2; done'
          echo "Stack is up!"

      # On a cache MISS the ollama container has now pulled the model weights
      # (the proxy only answers once backend -> ollama is healthy, i.e. all models
      # are present). Snapshot the volume so actions/cache persists it in its
      # post-job save step, making the next run a hit. Skipped on a hit (the
      # tarball is already the restored cache; the key exists, so no re-save).
      - name: Snapshot Ollama model weights (cache miss)
        if: steps.cache-ollama-models.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          echo "Cache miss — snapshotting pulled Ollama model weights for next run:"
          cat .github/ollama-models.txt | grep -vE '^\s*#|^\s*$'
          mkdir -p /tmp/ollama-models
          docker run --rm \
            -v "${COMPOSE_PROJECT_NAME}_ollama_data":/root/.ollama \
            -v /tmp/ollama-models:/backup \
            alpine sh -c 'cd /root/.ollama && tar cf /backup/ollama-models.tar .'

      - name: Seed E2E Data
        run: |
          docker compose -f docker-compose.prod.yml exec -T backend python scripts/seed_e2e_user.py

      # E2E is split by app so the two flows are legible in the run log.
      # Both target the same running proxy: public on http://localhost:80,
      # admin on http://admin.localhost (mapped to loopback above).
      - name: E2E · Public Site
        working-directory: ./frontend
        env:
          BASE_URL: http://localhost:80
          ADMIN_BASE_URL: http://admin.localhost
        run: npx playwright test --project=public-e2e

      - name: E2E · Admin Console
        working-directory: ./frontend
        env:
          BASE_URL: http://localhost:80
          ADMIN_BASE_URL: http://admin.localhost
        run: npx playwright test --project=admin-e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================
  # PUBLISH ARTIFACTS (Split for Visibility)
  # ============================================
  publish-backend:
    name: Publish Backend
    runs-on: ubuntu-latest
    needs: [proxy-startup-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Promote Backend Image
        run: |
          REPO_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA_TAG=$REPO_BASE-backend:sha-${{ github.sha }}
          VERSION=${{ steps.get_version.outputs.version }}

          docker pull $SHA_TAG
          docker tag $SHA_TAG $REPO_BASE-backend:latest
          docker tag $SHA_TAG $REPO_BASE-backend:$VERSION
          docker push $REPO_BASE-backend:latest
          docker push $REPO_BASE-backend:$VERSION

  publish-frontend:
    name: Publish Frontend
    runs-on: ubuntu-latest
    needs: [proxy-startup-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Promote Frontend Image
        run: |
          REPO_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA_TAG=$REPO_BASE-frontend:sha-${{ github.sha }}
          VERSION=${{ steps.get_version.outputs.version }}

          docker pull $SHA_TAG
          docker tag $SHA_TAG $REPO_BASE-frontend:latest
          docker tag $SHA_TAG $REPO_BASE-frontend:$VERSION
          docker push $REPO_BASE-frontend:latest
          docker push $REPO_BASE-frontend:$VERSION

  publish-admin-frontend:
    name: Publish Admin Frontend
    runs-on: ubuntu-latest
    needs: [proxy-startup-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Promote Admin Frontend Image
        run: |
          REPO_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA_TAG=$REPO_BASE-admin-frontend:sha-${{ github.sha }}
          VERSION=${{ steps.get_version.outputs.version }}

          docker pull $SHA_TAG
          docker tag $SHA_TAG $REPO_BASE-admin-frontend:latest
          docker tag $SHA_TAG $REPO_BASE-admin-frontend:$VERSION
          docker push $REPO_BASE-admin-frontend:latest
          docker push $REPO_BASE-admin-frontend:$VERSION

  publish-proxy:
    name: Publish Proxy
    runs-on: ubuntu-latest
    needs: [proxy-startup-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Promote Proxy Image
        run: |
          REPO_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA_TAG=$REPO_BASE-proxy:sha-${{ github.sha }}
          VERSION=${{ steps.get_version.outputs.version }}

          docker pull $SHA_TAG
          docker tag $SHA_TAG $REPO_BASE-proxy:latest
          docker tag $SHA_TAG $REPO_BASE-proxy:$VERSION
          docker push $REPO_BASE-proxy:latest
          docker push $REPO_BASE-proxy:$VERSION

  # ============================================
  # SMOKE TESTS (Fast Verification)
  # ============================================
  proxy-startup-test:
    name: Proxy Verification (Smoke Test)
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prune Pre-Run (Free Space)
        run: |
          docker system prune -a -f --volumes
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js (for Playwright)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Restore cached base images
        id: cache-base-images
        uses: actions/cache@v6
        with:
          path: /tmp/base-images
          key: base-images-${{ hashFiles('.github/base-images.txt') }}

      - name: Load or pull base images
        run: |
          set -eo pipefail
          mkdir -p /tmp/base-images
          TAR=/tmp/base-images/images.tar
          IMAGES="$(grep -vE '^\s*#|^\s*$' .github/base-images.txt)"
          if [ -f "$TAR" ]; then
            echo "Cache hit — loading pinned base images from tarball (no pull):"
            echo "$IMAGES"
            docker load -i "$TAR"
          else
            echo "Cache miss — pulling pinned base images:"
            echo "$IMAGES"
            for img in $IMAGES; do docker pull "$img"; done
            docker save $IMAGES -o "$TAR"
          fi

      - name: Start Proxy Stack
        env:
          # Use "sha-<hash>" tag to pull the candidate images
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          # Start proxy (Certbot is gone from compose.prod)
          docker compose -f docker-compose.prod.yml up -d proxy

      - name: Wait for Bootstrap
        run: sleep 10

      - name: Check Container Status
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' global_proxy)" != "true" ]; then
            echo "Proxy container died!"
            docker logs global_proxy
            exit 1
          fi

      - name: Verify Proxy Start
        run: |
          LOGS=$(docker logs global_proxy 2>&1)

          echo "=== PROXY LOGS ==="
          echo "$LOGS"

          if echo "$LOGS" | grep -q "Starting Nginx..."; then
             echo "✅ Nginx started"
          else
             echo "❌ Nginx start log missing"
             exit 1
          fi
