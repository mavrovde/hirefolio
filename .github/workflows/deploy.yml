name: Prod Deployment

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # ============================================
  # BACKEND QA
  # ============================================
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip download linkedin-api==2.2.1 --no-deps -d /tmp/wheels
          python -c "import zipfile; src='/tmp/wheels/linkedin_api-2.2.1-py3-none-any.whl'; dst='/tmp/wheels/patched.whl'; zin=zipfile.ZipFile(src,'r'); zout=zipfile.ZipFile(dst,'w'); [zout.writestr(i, zin.read(i.filename).replace(b'lint = black:None\n',b'')) if i.filename.endswith('entry_points.txt') else zout.writestr(i, zin.read(i.filename)) for i in zin.infolist()]; zin.close(); zout.close()"
          pip install /tmp/wheels/patched.whl && rm -rf /tmp/wheels
          pip install -r requirements-dev.txt
      - name: Run Ruff (lint)
        working-directory: ./backend
        run: ruff check . --output-format=github
      - name: Run Ruff (format check)
        working-directory: ./backend
        run: ruff format . --check

  backend-type-check:
    name: Backend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip download linkedin-api==2.2.1 --no-deps -d /tmp/wheels
          python -c "import zipfile; src='/tmp/wheels/linkedin_api-2.2.1-py3-none-any.whl'; dst='/tmp/wheels/patched.whl'; zin=zipfile.ZipFile(src,'r'); zout=zipfile.ZipFile(dst,'w'); [zout.writestr(i, zin.read(i.filename).replace(b'lint = black:None\n',b'')) if i.filename.endswith('entry_points.txt') else zout.writestr(i, zin.read(i.filename)) for i in zin.infolist()]; zin.close(); zout.close()"
          pip install /tmp/wheels/patched.whl && rm -rf /tmp/wheels
          pip install -r requirements-dev.txt
      - name: Run MyPy
        working-directory: ./backend
        run: mypy app --ignore-missing-imports --no-error-summary || true

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip download linkedin-api==2.2.1 --no-deps -d /tmp/wheels
          python -c "import zipfile; src='/tmp/wheels/linkedin_api-2.2.1-py3-none-any.whl'; dst='/tmp/wheels/patched.whl'; zin=zipfile.ZipFile(src,'r'); zout=zipfile.ZipFile(dst,'w'); [zout.writestr(i, zin.read(i.filename).replace(b'lint = black:None\n',b'')) if i.filename.endswith('entry_points.txt') else zout.writestr(i, zin.read(i.filename)) for i in zin.infolist()]; zin.close(); zout.close()"
          pip install /tmp/wheels/patched.whl && rm -rf /tmp/wheels
          pip install -r requirements-dev.txt
      - name: Run Bandit (security)
        working-directory: ./backend
        run: bandit -r app -ll --skip B101

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-type-check, backend-security]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_mavrov
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip download linkedin-api==2.2.1 --no-deps -d /tmp/wheels
          python -c "import zipfile; src='/tmp/wheels/linkedin_api-2.2.1-py3-none-any.whl'; dst='/tmp/wheels/patched.whl'; zin=zipfile.ZipFile(src,'r'); zout=zipfile.ZipFile(dst,'w'); [zout.writestr(i, zin.read(i.filename).replace(b'lint = black:None\n',b'')) if i.filename.endswith('entry_points.txt') else zout.writestr(i, zin.read(i.filename)) for i in zin.infolist()]; zin.close(); zout.close()"
          pip install /tmp/wheels/patched.whl && rm -rf /tmp/wheels
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_mavrov
          SECRET_KEY: test-secret-key-for-ci
          OLLAMA_BASE_URL: http://localhost:11434
        run: |
          pytest -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
  # ============================================
  # FRONTEND QA
  # ============================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint --if-present || true

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps
      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm test -- --watch=false --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # ============================================
  # PROXY QA
  # ============================================
  proxy-config-audit:
    name: Proxy Config Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for forbidden legacy configurations
        run: |
          if grep -iE "roundcube|mailserver|webmail" proxy/default.conf; then
            echo "Error: Forbidden legacy configuration (roundcube/mailserver/webmail) found in proxy/default.conf"
            exit 1
          fi
          echo "Proxy config is clean of legacy terms."

  # ============================================
  # BUILD ARTIFACTS (Parallel Builds)
  # ============================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [backend-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-proxy:
    name: Build Proxy Image
    runs-on: ubuntu-latest
    needs: [proxy-config-audit]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Certificates
        env:
          SSL_CRT: ${{ secrets.SSL_CRT }}
          SSL_KEY: ${{ secrets.SSL_KEY }}
        run: |
          mkdir -p proxy/certs
          # PRIORITY 1: Local Certificates (from repo)
          if [ -f "certs/mavrov.de.bundle.cer" ] && [ -f "certs/mavrov.de.key" ]; then
            echo "✅ Found local certificates in repo. Using them..."
            cp certs/mavrov.de.bundle.cer proxy/certs/
            cp certs/mavrov.de.key proxy/certs/
          # PRIORITY 2: Secrets
          elif [ -n "$SSL_CRT" ]; then
            echo "$SSL_CRT" > proxy/certs/mavrov.de.bundle.cer
            echo "$SSL_KEY" > proxy/certs/mavrov.de.key
          # PRIORITY 3: Dummy (Fallback)
          else
            echo "⚠️  No certs found. Generating dummy certs..."
            openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
              -keyout proxy/certs/mavrov.de.key \
              -out proxy/certs/mavrov.de.bundle.cer \
              -subj "/CN=mavrov.de"
          fi

      # Build & Push Proxy
      - name: Build and Push Proxy
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-proxy:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # E2E TESTS (Test What You Fly)
  # ============================================
  e2e-tests:
    name: E2E Tests (Docker Stack)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-proxy]
    steps:
      - uses: actions/checkout@v4

      - name: Prune Pre-Run (Free Space)
        run: docker system prune -a -f --volumes

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Full Stack (Prod Topology)
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mavrov
          IMAGE_TAG: sha-${{ github.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Start stack
          docker compose -f docker-compose.prod.yml up -d

      - name: Set up Node.js (for Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps

      - name: Get installed Playwright version
        id: playwright-version
        working-directory: ./frontend
        run: |
          PW_VERSION=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)
          echo "version=$PW_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Pull Standard Images
        run: |
          docker pull pgvector/pgvector:pg18
          docker pull ollama/ollama:latest
          docker pull ghcr.io/open-webui/open-webui:latest

      - name: Wait for Stack Ready
        run: |
          echo "Waiting for frontend to respond on port 4200..."
          timeout 60s bash -c 'until curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 | grep "200\|302"; do sleep 2; done'
          echo "Stack is up!"

      - name: Seed E2E Data
        run: |
          docker compose -f docker-compose.prod.yml exec -T backend python scripts/seed_e2e_user.py

      - name: Run Playwright Tests (Targeting Frontend Directly)
        working-directory: ./frontend
        env:
          # Point Playwright directly to the Frontend
          BASE_URL: http://localhost:4200
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================
  # PUBLISH ARTIFACTS (Split for Visibility)
  # ============================================
  publish-backend:
    name: Publish Backend
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Promote Backend Image
        run: |
          REPO_BASE=${{ env.REGISTRY }}/${{ github.repository }}
          SHA_TAG=$REPO_BASE-backend:sha-${{ github.sha }}
          VERSION=${{ steps.get_version.outputs.version }}

          docker pull $SHA_TAG
          docker tag $SHA_TAG $REPO_BASE-backend:latest
          docker tag $SHA_TAG $REPO_BASE-backend:$VERSION
          docker push $REPO_BASE-backend:latest
          docker push $REPO_BASE-backend:$VERSION

  publish-frontend:
    name: Publish Frontend
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Promote Frontend Image
        run: |
          REPO_BASE=${{ env.REGISTRY }}/${{ github.repository }}
          SHA_TAG=$REPO_BASE-frontend:sha-${{ github.sha }}
          VERSION=${{ steps.get_version.outputs.version }}

          docker pull $SHA_TAG
          docker tag $SHA_TAG $REPO_BASE-frontend:latest
          docker tag $SHA_TAG $REPO_BASE-frontend:$VERSION
          docker push $REPO_BASE-frontend:latest
          docker push $REPO_BASE-frontend:$VERSION

  publish-proxy:
    name: Publish Proxy
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Promote Proxy Image
        run: |
          REPO_BASE=${{ env.REGISTRY }}/${{ github.repository }}
          SHA_TAG=$REPO_BASE-proxy:sha-${{ github.sha }}
          VERSION=${{ steps.get_version.outputs.version }}

          docker pull $SHA_TAG
          docker tag $SHA_TAG $REPO_BASE-proxy:latest
          docker tag $SHA_TAG $REPO_BASE-proxy:$VERSION
          docker push $REPO_BASE-proxy:latest
          docker push $REPO_BASE-proxy:$VERSION

  # ============================================
  # SMOKE TESTS (Fast Verification)
  # ============================================
  proxy-startup-test:
    name: Proxy Verification (Smoke Test)
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prune Pre-Run (Free Space)
        run: docker system prune -a -f --volumes

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js (for Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Pull Standard Images
        run: |
          docker pull pgvector/pgvector:pg18
          docker pull ollama/ollama:latest
          docker pull ghcr.io/open-webui/open-webui:latest

      - name: Start Proxy Stack
        env:
          # Use "sha-<hash>" tag to pull the candidate images
          IMAGE_TAG: sha-${{ github.sha }}
          IMAGE_NAME: ${{ github.repository }}
        run: |
          # Create dummy certs
          mkdir -p certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout certs/mavrov.de.key \
            -out certs/mavrov.de.bundle.cer \
            -subj "/CN=mavrov.de"

          # Start proxy (Certbot is gone from compose.prod)
          docker compose -f docker-compose.prod.yml up -d proxy

      - name: Wait for Bootstrap
        run: sleep 10

      - name: Check Container Status
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' global_proxy)" != "true" ]; then
            echo "Proxy container died!"
            docker logs global_proxy
            exit 1
          fi

      - name: Verify Static SSL Mode
        run: |
          LOGS=$(docker logs global_proxy 2>&1)

          echo "=== PROXY LOGS ==="
          echo "$LOGS"

          if echo "$LOGS" | grep -q "Starting Nginx in static SSL mode..."; then
            echo "✅ Static SSL mode initialized"
          else
            echo "❌ Static SSL mode log missing"
            exit 1
          fi
          if echo "$LOGS" | grep -q "Starting Nginx..."; then
             echo "✅ Nginx started"
          else
             echo "❌ Nginx start log missing"
             exit 1
          fi
