name: Prod Deployment

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # ============================================
  # BACKEND QA
  # ============================================
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run Ruff (lint)
        working-directory: ./backend
        run: ruff check . --output-format=github
      - name: Run Ruff (format check)
        working-directory: ./backend
        run: ruff format . --check

  backend-type-check:
    name: Backend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run MyPy
        working-directory: ./backend
        run: mypy app --ignore-missing-imports --no-error-summary || true

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run Bandit (security)
        working-directory: ./backend
        run: bandit -r app -ll --skip B101

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-type-check, backend-security]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_mavrov
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_mavrov
          SECRET_KEY: test-secret-key-for-ci
          OLLAMA_BASE_URL: http://localhost:11434
        run: |
          pytest -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
  # ============================================
  # FRONTEND QA
  # ============================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint --if-present || true

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps
      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm test -- --watch=false --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # ============================================
  # PROXY QA
  # ============================================
  proxy-config-audit:
    name: Proxy Config Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for forbidden legacy configurations
        run: |
          if grep -iE "roundcube|mailserver|webmail" proxy/default.conf; then
            echo "Error: Forbidden legacy configuration (roundcube/mailserver/webmail) found in proxy/default.conf"
            exit 1
          fi
          echo "Proxy config is clean of legacy terms."

  # ============================================
  # BUILD ARTIFACTS (Parallel Builds)
  # ============================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [backend-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-proxy:
    name: Build Proxy Image
    runs-on: ubuntu-latest
    needs: [proxy-config-audit]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Certificates
        env:
          SSL_CRT: ${{ secrets.SSL_CRT }}
          SSL_KEY: ${{ secrets.SSL_KEY }}
        run: |
          mkdir -p proxy/certs
          if [ -n "$SSL_CRT" ]; then
            echo "$SSL_CRT" > proxy/certs/mavrov.de.bundle.cer
            echo "$SSL_KEY" > proxy/certs/mavrov.de.key
          else
            # Fallback to dummy certs for CI validation if secrets aren't set yet
            openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
              -keyout proxy/certs/mavrov.de.key \
              -out proxy/certs/mavrov.de.bundle.cer \
              -subj "/CN=mavrov.de"
          fi

      # Build & Push Proxy
      - name: Build and Push Proxy
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-proxy:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # E2E TESTS (Test What You Fly)
  # ============================================
  e2e-tests:
    name: E2E Tests (Docker Stack)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-proxy, proxy-startup-test]
    steps:
      - uses: actions/checkout@v4

      - name: Prune Pre-Run (Free Space)
        run: docker system prune -a -f --volumes

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Proxy & Dependencies
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mavrov
        run: |
          # Create dummy certs for CI E2E tests so proxy starts
          mkdir -p certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout certs/mavrov.de.key \
            -out certs/mavrov.de.bundle.cer \
            -subj "/CN=mavrov.de"

          # Use "sha-<hash>" tag to pull the candidate images
          export IMAGE_TAG=sha-${{ github.sha }}
          docker compose -f docker-compose.prod.yml up -d proxy

      - name: Set up Node.js (for Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps

      - name: Get installed Playwright version
        id: playwright-version
        working-directory: ./frontend
        run: |
          PW_VERSION=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)
          echo "version=$PW_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install --with-deps

      # Cache standard images (DB, Ollama)
      - name: Cache Standard Images
        id: cache-std-images
        uses: actions/cache@v4
        with:
          path: std-images
          key: std-images-${{ runner.os }}-v1

      - name: Load/Pull Standard Images
        run: |
          if [ -d "std-images" ]; then
            ls std-images/*.tar | xargs -I {} docker load -i {}
          else
            mkdir -p std-images
            docker pull pgvector/pgvector:pg18
            docker pull ollama/ollama:latest
            docker pull ghcr.io/open-webui/open-webui:latest
            docker save pgvector/pgvector:pg18 -o std-images/pgvector.tar
            docker save ollama/ollama:latest -o std-images/ollama.tar
            docker save ghcr.io/open-webui/open-webui:latest -o std-images/open-webui.tar
          fi

      - name: Start Full Stack (Prod Topology)
        env:
          # Use the 'ci' tag we built
          IMAGE_TAG: ci
          # Override image names in compose to match what we loaded if needed
          # But for now assuming compose uses ghcr.io/...:${IMAGE_TAG}
          # We need to tag our loaded images to match
        run: |
          # Retag loaded images to match docker-compose requirements
          docker tag mavrovde-backend:ci ghcr.io/${{ github.repository }}-backend:ci
          docker tag mavrovde-frontend:ci ghcr.io/${{ github.repository }}-frontend:ci
          docker tag mavrovde-proxy:ci ghcr.io/${{ github.repository }}-proxy:ci

          # Start stack
          docker compose -f docker-compose.prod.yml up -d

      - name: Wait for Stack Ready
        run: |
          echo "Waiting for proxy to respond on port 80..."
          timeout 60s bash -c 'until curl -s -o /dev/null -w "%{http_code}" -H "Host: mavrov.de" http://localhost:80 | grep "301"; do sleep 2; done'
          echo "Stack is up!"

      - name: Run Playwright Tests (Targeting Docker Stack)
        working-directory: ./frontend
        env:
          # Point Playwright to the Proxy (localhost:80)
          BASE_URL: http://localhost:80
          # We might need to handle the redirect or test HTTPS if proxy enforces it?
          # Or just test HTTP if we haven't set up valid certs in CI?
          # Actually, the proxy redirects 80->443. Playwright might fail on self-signed certs.
          # For CI E2E, maybe we should hit the frontend directly or allow insecure certs?
          # Let's hit the frontend container port 80?
          # No, prod compose doesn't expose frontend ports.
          # We should test via Proxy. We can tell Playwright to ignore HTTPS errors.
        run: npx playwright test --ignore-https-errors

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================
  # PUBLISH ARTIFACTS (Split for Visibility)
  # ============================================
  publish-backend:
    name: Publish Backend
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Promote Backend Image
        run: |
          REPO_BASE=${{ env.REGISTRY }}/${{ github.repository }}
          SHA_TAG=$REPO_BASE-backend:sha-${{ github.sha }}
          VERSION=${{ steps.get_version.outputs.version }}

          docker pull $SHA_TAG
          docker tag $SHA_TAG $REPO_BASE-backend:latest
          docker tag $SHA_TAG $REPO_BASE-backend:$VERSION
          docker push $REPO_BASE-backend:latest
          docker push $REPO_BASE-backend:$VERSION

  publish-frontend:
    name: Publish Frontend
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Promote Frontend Image
        run: |
          REPO_BASE=${{ env.REGISTRY }}/${{ github.repository }}
          SHA_TAG=$REPO_BASE-frontend:sha-${{ github.sha }}
          VERSION=${{ steps.get_version.outputs.version }}

          docker pull $SHA_TAG
          docker tag $SHA_TAG $REPO_BASE-frontend:latest
          docker tag $SHA_TAG $REPO_BASE-frontend:$VERSION
          docker push $REPO_BASE-frontend:latest
          docker push $REPO_BASE-frontend:$VERSION

  publish-proxy:
    name: Publish Proxy
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Promote Proxy Image
        run: |
          REPO_BASE=${{ env.REGISTRY }}/${{ github.repository }}
          SHA_TAG=$REPO_BASE-proxy:sha-${{ github.sha }}
          VERSION=${{ steps.get_version.outputs.version }}

          docker pull $SHA_TAG
          docker tag $SHA_TAG $REPO_BASE-proxy:latest
          docker tag $SHA_TAG $REPO_BASE-proxy:$VERSION
          docker push $REPO_BASE-proxy:latest
          docker push $REPO_BASE-proxy:$VERSION

  # ============================================
  # SMOKE TESTS (Fast Verification)
  # ============================================
  proxy-startup-test:
    name: Proxy Verification (Smoke Test)
    needs: [build-backend, build-frontend, build-proxy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prune Pre-Run (Free Space)
        run: docker system prune -a -f --volumes

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js (for Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Cache standard images (Reuse cache from E2E)
      - name: Cache Standard Images
        id: cache-std-images
        uses: actions/cache@v4
        with:
          path: std-images
          key: std-images-${{ runner.os }}-v1

      - name: Load/Pull Standard Images
        run: |
          if [ -d "std-images" ]; then
            ls std-images/*.tar | xargs -I {} docker load -i {}
          else
            # Fallback if cache miss (should be hit if E2E ran or previous runs populated it)
             mkdir -p std-images
             docker pull pgvector/pgvector:pg18
             docker pull ollama/ollama:latest
             docker pull ghcr.io/open-webui/open-webui:latest
             docker save pgvector/pgvector:pg18 -o std-images/pgvector.tar
             docker save ollama/ollama:latest -o std-images/ollama.tar
             docker save ghcr.io/open-webui/open-webui:latest -o std-images/open-webui.tar
          fi

      - name: Start Proxy Stack
        env:
          # Use "sha-<hash>" tag to pull the candidate images
          IMAGE_TAG: sha-${{ github.sha }}
          IMAGE_NAME: ${{ github.repository }}
        run: |
          # Create dummy certs
          mkdir -p certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout certs/mavrov.de.key \
            -out certs/mavrov.de.bundle.cer \
            -subj "/CN=mavrov.de"

          # Start proxy (Certbot is gone from compose.prod)
          docker compose -f docker-compose.prod.yml up -d proxy

      - name: Wait for Bootstrap
        run: sleep 10

      - name: Check Container Status
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' global_proxy)" != "true" ]; then
            echo "Proxy container died!"
            docker logs global_proxy
            exit 1
          fi

      - name: Verify Static SSL Mode
        run: |
          LOGS=$(docker logs global_proxy 2>&1)

          echo "=== PROXY LOGS ==="
          echo "$LOGS"

          if echo "$LOGS" | grep -q "Starting Nginx in static SSL mode..."; then
            echo "✅ Static SSL mode initialized"
          else
            echo "❌ Static SSL mode log missing"
            exit 1
          fi
          if echo "$LOGS" | grep -q "Starting Nginx..."; then
             echo "✅ Nginx started"
          else
             echo "❌ Nginx start log missing"
             exit 1
          fi
