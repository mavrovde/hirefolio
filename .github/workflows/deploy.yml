name: Prod Deployment

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # ============================================
  # BACKEND QA
  # ============================================
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run Ruff (lint)
        working-directory: ./backend
        run: ruff check . --output-format=github
      - name: Run Ruff (format check)
        working-directory: ./backend
        run: ruff format . --check

  backend-type-check:
    name: Backend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run MyPy
        working-directory: ./backend
        run: mypy app --ignore-missing-imports --no-error-summary || true

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run Bandit (security)
        working-directory: ./backend
        run: bandit -r app -ll --skip B101

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-type-check, backend-security]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_mavrov
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_mavrov
          SECRET_KEY: test-secret-key-for-ci
          OLLAMA_BASE_URL: http://localhost:11434
        run: |
          pytest -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
  # ============================================
  # BUILD ARTIFACTS (Build Once)
  # ============================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, proxy-config-audit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Export Backend
      - name: Build Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: mavrovde-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save Backend Image
        run: docker save mavrovde-backend:ci -o backend-image.tar

      # Build & Export Frontend
      - name: Build Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: mavrovde-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save Frontend Image
        run: docker save mavrovde-frontend:ci -o frontend-image.tar

      # Build & Export Proxy
      - name: Build Proxy
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: false
          load: true
          tags: mavrovde-proxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save Proxy Image
        run: docker save mavrovde-proxy:ci -o proxy-image.tar

      - name: Upload Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            backend-image.tar
            frontend-image.tar
            proxy-image.tar
          retention-days: 1

  # ============================================
  # E2E TESTS (Test What You Fly)
  # ============================================
  e2e-tests:
    name: E2E Tests (Docker Stack)
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v4

      - name: Download Image Artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: .

      - name: Load Docker Images
        run: |
          docker load -i backend-image.tar
          docker load -i frontend-image.tar
          docker load -i proxy-image.tar
          # Retag for Compose usage (matching what compose expects or override)
          # We will use IMAGE_TAG=ci environment var and ensure compose uses these

      - name: Set up Node.js (for Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps

      - name: Get installed Playwright version
        id: playwright-version
        working-directory: ./frontend
        run: |
          PW_VERSION=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)
          echo "version=$PW_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install --with-deps

      # Cache standard images (DB, Ollama)
      - name: Cache Standard Images
        id: cache-std-images
        uses: actions/cache@v4
        with:
          path: std-images
          key: std-images-${{ runner.os }}-v1

      - name: Load/Pull Standard Images
        run: |
          if [ -d "std-images" ]; then
            ls std-images/*.tar | xargs -I {} docker load -i {}
          else
            mkdir -p std-images
            docker pull pgvector/pgvector:pg18
            docker pull ollama/ollama:latest
            docker pull ghcr.io/open-webui/open-webui:latest
            docker pull certbot/certbot
            docker save pgvector/pgvector:pg18 -o std-images/pgvector.tar
            docker save ollama/ollama:latest -o std-images/ollama.tar
            docker save ghcr.io/open-webui/open-webui:latest -o std-images/open-webui.tar
            docker save certbot/certbot -o std-images/certbot.tar
          fi

      - name: Start Full Stack (Prod Topology)
        env:
          # Use the 'ci' tag we built
          IMAGE_TAG: ci
          # Override image names in compose to match what we loaded if needed
          # But for now assuming compose uses ghcr.io/...:${IMAGE_TAG}
          # We need to tag our loaded images to match
        run: |
          # Retag loaded images to match docker-compose requirements
          docker tag mavrovde-backend:ci ghcr.io/${{ github.repository }}-backend:ci
          docker tag mavrovde-frontend:ci ghcr.io/${{ github.repository }}-frontend:ci
          docker tag mavrovde-proxy:ci ghcr.io/${{ github.repository }}-proxy:ci

          # Start stack
          docker compose -f docker-compose.prod.yml up -d

      - name: Wait for Stack Ready
        run: |
          echo "Waiting for proxy to respond on port 80..."
          timeout 60s bash -c 'until curl -s -o /dev/null -w "%{http_code}" -H "Host: mavrov.de" http://localhost:80 | grep "301"; do sleep 2; done'
          echo "Stack is up!"

      - name: Run Playwright Tests (Targeting Docker Stack)
        working-directory: ./frontend
        env:
          # Point Playwright to the Proxy (localhost:80)
          BASE_URL: http://localhost:80
          # We might need to handle the redirect or test HTTPS if proxy enforces it?
          # Or just test HTTP if we haven't set up valid certs in CI?
          # Actually, the proxy redirects 80->443. Playwright might fail on self-signed certs.
          # For CI E2E, maybe we should hit the frontend directly or allow insecure certs?
          # Let's hit the frontend container port 80?
          # No, prod compose doesn't expose frontend ports.
          # We should test via Proxy. We can tell Playwright to ignore HTTPS errors.
        run: npx playwright test --ignore-https-errors

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================
  # PUBLISH IMAGES (Push Verified Artifacts)
  # ============================================
  publish-images:
    name: Publish Verified Images
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract project version
        id: get_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Image Artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: .

      - name: Load and Push Images
        run: |
          # Load the images built in the first stage
          docker load -i backend-image.tar
          docker load -i frontend-image.tar
          docker load -i proxy-image.tar

          # Define targets
          REPO_BASE=${{ env.REGISTRY }}/${{ github.repository }}
          VERSION=${{ steps.get_version.outputs.version }}

          # Tag and Push Backend
          docker tag mavrovde-backend:ci $REPO_BASE-backend:latest
          docker tag mavrovde-backend:ci $REPO_BASE-backend:$VERSION
          docker push $REPO_BASE-backend:latest
          docker push $REPO_BASE-backend:$VERSION

          # Tag and Push Frontend
          docker tag mavrovde-frontend:ci $REPO_BASE-frontend:latest
          docker tag mavrovde-frontend:ci $REPO_BASE-frontend:$VERSION
          docker push $REPO_BASE-frontend:latest
          docker push $REPO_BASE-frontend:$VERSION

          # Tag and Push Proxy
          docker tag mavrovde-proxy:ci $REPO_BASE-proxy:latest
          docker push $REPO_BASE-proxy:latest
          docker push $REPO_BASE-proxy:$VERSION

  # ============================================
  # SMOKE TESTS (Fast Verification)
  # ============================================
  proxy-startup-test:
    name: Proxy Verification (Smoke Test)
    runs-on: ubuntu-latest
    needs: [build-images] # Reuse artifacts
    steps:
      - uses: actions/checkout@v4

      - name: Download Image Artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: .

      - name: Load Docker Images
        run: |
          docker load -i backend-image.tar
          docker load -i frontend-image.tar
          docker load -i proxy-image.tar

      # Cache standard images (Reuse cache from E2E)
      - name: Cache Standard Images
        id: cache-std-images
        uses: actions/cache@v4
        with:
          path: std-images
          key: std-images-${{ runner.os }}-v1

      - name: Load/Pull Standard Images
        run: |
          if [ -d "std-images" ]; then
            ls std-images/*.tar | xargs -I {} docker load -i {}
          else
            # Fallback if cache miss (should be hit if E2E ran or previous runs populated it)
             mkdir -p std-images
             docker pull pgvector/pgvector:pg18
             docker pull ollama/ollama:latest
             docker pull ghcr.io/open-webui/open-webui:latest
             docker pull certbot/certbot
             docker save pgvector/pgvector:pg18 -o std-images/pgvector.tar
             docker save ollama/ollama:latest -o std-images/ollama.tar
             docker save ghcr.io/open-webui/open-webui:latest -o std-images/open-webui.tar
             docker save certbot/certbot -o std-images/certbot.tar
          fi

      - name: Start Proxy Stack
        env:
          IMAGE_TAG: ci
          IMAGE_NAME: ${{ github.repository }}
        run: |
          # Retag loaded images to match docker-compose requirements
          docker tag mavrovde-backend:ci ghcr.io/${{ github.repository }}-backend:ci
          docker tag mavrovde-frontend:ci ghcr.io/${{ github.repository }}-frontend:ci
          docker tag mavrovde-proxy:ci ghcr.io/${{ github.repository }}-proxy:ci

          # Start proxy AND certbot (and deps will start because of depends_on, or we force if needed)
          # We just need proxy and certbot to verify SSL bootstrap
          docker compose -f docker-compose.prod.yml up -d proxy certbot

      - name: Wait for Bootstrap
        run: sleep 10

      - name: Check Container Status
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' global_proxy)" != "true" ]; then
            echo "Proxy container died!"
            docker logs global_proxy
            exit 1
          fi

      - name: Verify Bootstrap Logs
        run: |
          LOGS=$(docker logs global_proxy 2>&1)
          CERTBOT_LOGS=$(docker compose -f docker-compose.prod.yml logs certbot 2>&1)

          echo "=== PROXY LOGS ==="
          echo "$LOGS"
          echo "=== CERTBOT LOGS ==="
          echo "$CERTBOT_LOGS"

          if echo "$LOGS" | grep -q "Bootstrapping Nginx SSL"; then
            echo "✅ Bootstrap started"
          else
            echo "❌ Bootstrap log missing"
            exit 1
          fi
          if echo "$LOGS" | grep -q "Starting Nginx"; then
             echo "✅ Nginx started"
          else
             echo "❌ Nginx start log missing"
             exit 1
          fi

          # Verify Certbot
          if echo "$CERTBOT_LOGS" | grep -q "Requesting start certificate..."; then
             echo "✅ Certbot attempting request"
          else
             echo "❌ Certbot activity missing"
             exit 1
          fi
