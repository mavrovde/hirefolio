name: Prod Deployment

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # ============================================
  # BACKEND QA
  # ============================================
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run Ruff (lint)
        working-directory: ./backend
        run: ruff check . --output-format=github
      - name: Run Ruff (format check)
        working-directory: ./backend
        run: ruff format . --check

  backend-type-check:
    name: Backend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run MyPy
        working-directory: ./backend
        run: mypy app --ignore-missing-imports --no-error-summary || true

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run Bandit (security)
        working-directory: ./backend
        run: bandit -r app -ll --skip B101

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-type-check, backend-security]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_mavrov
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_mavrov
          SECRET_KEY: test-secret-key-for-ci
          OLLAMA_BASE_URL: http://localhost:11434
        run: |
          pytest -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
  backend-build-check:
    name: Backend Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # E2E TESTS
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-build-check, frontend-tests, frontend-build-check]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps

      - name: Get installed Playwright version
        id: playwright-version
        working-directory: ./frontend
        run: |
          PW_VERSION=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)
          echo "version=$PW_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright System Dependencies
        working-directory: ./frontend
        run: npx playwright install-deps

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install

      - name: Create Ollama model cache directory
        run: mkdir -p ollama-models

      - name: Cache Ollama models
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: ollama-models
          key: ollama-models-v1

      - name: Cache Docker Images
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: docker-images
          key: docker-images-${{ runner.os }}-${{ hashFiles('backend/Dockerfile', 'frontend/Dockerfile') }}

      - name: Load Cached Docker Images
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: |
          ls docker-images/*.tar | xargs -I {} docker load -i {}

      - name: Pull and Save Docker Images
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          mkdir -p docker-images
          docker pull pgvector/pgvector:pg18
          docker save pgvector/pgvector:pg18 -o docker-images/pgvector.tar
          docker pull ollama/ollama:latest
          docker save ollama/ollama:latest -o docker-images/ollama.tar

      - name: Start Services (DB)
        run: |
          docker run -d \
            --name db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=test_mavrov \
            -p 5432:5432 \
            pgvector/pgvector:pg18

          # Wait for it to be ready
          until docker exec db pg_isready; do sleep 1; done

      - name: Start AI Service (Ollama)
        run: |
          # Start Ollama container with volume mount for caching
          # We mount to /root/.ollama which is the default for models
          docker run -d --name ollama -p 11434:11434 \
            -v ${{ github.workspace }}/ollama-models:/root/.ollama \
            ollama/ollama:latest

          # Ensure permissions are correct for the mounted volume
          docker exec ollama chown -R root:root /root/.ollama

          # Wait for Ollama to be responsive
          timeout 30s bash -c 'until curl -s http://localhost:11434 > /dev/null; do sleep 1; done'

          # Pull models (will be fast if cached)
          echo "Pulling AI models..."
          docker exec ollama ollama pull nomic-embed-text
          docker exec ollama ollama pull tinyllama

          # Fix permissions for the mounted volume so runner can cache it
          # The files were created by root inside the container
          sudo chown -R $USER:$USER ${{ github.workspace }}/ollama-models

          echo "Pre-warming TinyLlama..."
          docker exec ollama ollama run tinyllama "hi"

      - name: Start Backend
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_mavrov
          SECRET_KEY: test-secret-key-for-ci
          OLLAMA_BASE_URL: http://localhost:11434
        run: |
          # Start backend in background
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          # Wait for it to be ready
          timeout 30s bash -c 'until curl -s http://localhost:8000/api/health > /dev/null; do sleep 1; done'

      - name: Seed Backend Data
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_mavrov
        run: python scripts/seed_e2e_user.py

      - name: Start Frontend
        working-directory: ./frontend
        run: |
          # Start frontend in background
          npm start -- --port 4200 &
          # Wait for it to be ready
          timeout 60s bash -c 'until curl -s http://localhost:4200 > /dev/null; do sleep 1; done'

      - name: Run Playwright Tests
        working-directory: ./frontend
        env:
          BASE_URL: http://localhost:4200
        run: npm run e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Finalize Cache Permissions
        if: always()
        run: |
          # Ensure the runner user owns all cached directories and their recursive contents
          # This is the last chance to fix permissions before the automated Post-job Cache step
          if [ -d "ms-playwright" ]; then
            sudo chown -R $USER:$USER ms-playwright
            chmod -R u+rw ms-playwright
          fi
          if [ -d "ollama-models" ]; then
            sudo chown -R $USER:$USER ollama-models
            chmod -R u+rw ollama-models
          fi
          if [ -d "docker-images" ]; then
            sudo chown -R $USER:$USER docker-images
            chmod -R u+rw docker-images
          fi

  # ============================================
  # FRONTEND QA
  # ============================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint --if-present || true

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps
      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm test -- --watch=false --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  frontend-build-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Frontend (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # PROXY QA
  # ============================================
  proxy-config-audit:
    name: Proxy Config Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for forbidden legacy configurations
        run: |
          if grep -iE "roundcube|mailserver|webmail" proxy/default.conf; then
            echo "Error: Forbidden legacy configuration (roundcube/mailserver/webmail) found in proxy/default.conf"
            exit 1
          fi
          echo "Proxy config is clean of legacy terms."

  # ============================================
  # BUILD & DEPLOY ARTIFACTS
  # ============================================

  build-push-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Extract metadata (tags, labels) for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.get_version.outputs.version }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Extract metadata (tags, labels) for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.get_version.outputs.version }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-to: type=gha,mode=max

  build-push-proxy:
    name: Build & Push Proxy
    runs-on: ubuntu-latest
    needs: [proxy-config-audit, e2e-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Extract metadata (tags, labels) for Proxy
        id: meta-proxy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-proxy
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.get_version.outputs.version }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Proxy
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  proxy-startup-test:
    name: Proxy Verification (Smoke Test)
    runs-on: ubuntu-latest
    needs: [build-push-proxy, build-push-backend, build-push-frontend] # Wait for all images to be pushed
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Proxy (Local Load)
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: false
          load: true # Load into local Docker daemon
          tags: ghcr.io/${{ github.repository }}-proxy:latest
          cache-from: type=gha

      - name: Cache Smoke Test Images
        id: cache-smoke-images
        uses: actions/cache@v4
        with:
          path: smoke-images
          key: smoke-test-images-${{ runner.os }}-v1

      - name: Load Cached Smoke Test Images
        if: steps.cache-smoke-images.outputs.cache-hit == 'true'
        run: |
          ls smoke-images/*.tar | xargs -I {} docker load -i {}

      - name: Pull and Save Smoke Test Images
        if: steps.cache-smoke-images.outputs.cache-hit != 'true'
        run: |
          mkdir -p smoke-images
          echo "Pulling images..."
          docker pull ghcr.io/open-webui/open-webui:latest
          docker pull certbot/certbot
          docker pull pgvector/pgvector:pg18
          docker pull ollama/ollama:latest
          echo "Saving images..."
          docker save ghcr.io/open-webui/open-webui:latest -o smoke-images/open-webui.tar
          docker save certbot/certbot -o smoke-images/certbot.tar
          docker save pgvector/pgvector:pg18 -o smoke-images/pgvector.tar
          docker save ollama/ollama:latest -o smoke-images/ollama.tar

      - name: Start Proxy Stack (Prod Topology)
        env:
          IMAGE_TAG: latest
          IMAGE_NAME: ${{ github.repository }}
        run: |
          # Start proxy AND certbot
          docker compose -f docker-compose.prod.yml up -d proxy certbot

      - name: Wait for Bootstrap
        run: sleep 10

      - name: Check Container Status
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' global_proxy)" != "true" ]; then
            echo "Proxy container died!"
            docker logs global_proxy
            exit 1
          fi
          # Certbot might exit if it fails validation, but we just want to see logs. 
          # It shouldn't crash immediately.

      - name: Verify Bootstrap Logs
        run: |
          LOGS=$(docker logs global_proxy 2>&1)
          CERTBOT_LOGS=$(docker compose -f docker-compose.prod.yml logs certbot 2>&1)

          echo "=== PROXY LOGS ==="
          echo "$LOGS"
          echo "=== CERTBOT LOGS ==="
          echo "$CERTBOT_LOGS"

          if echo "$LOGS" | grep -q "Bootstrapping Nginx SSL"; then
            echo "✅ Bootstrap started"
          else
            echo "❌ Bootstrap log missing"
            exit 1
          fi
          if echo "$LOGS" | grep -q "Starting Nginx"; then
             echo "✅ Nginx started"
          else
             echo "❌ Nginx start log missing"
             exit 1
          fi

          # Verify Certbot
          if echo "$CERTBOT_LOGS" | grep -q "Requesting start certificate..."; then
             echo "✅ Certbot attempting request"
          else
             echo "❌ Certbot activity missing"
             exit 1
          fi

      - name: Verify HTTP Response (Port 80)
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: mavrov.de" http://localhost:80)
          if [ "$HTTP_CODE" == "301" ]; then
            echo "✅ Network passed (301 Redirect)"
          else
            echo "❌ Network failed. Code: $HTTP_CODE"
            exit 1
          fi
