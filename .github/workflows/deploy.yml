name: Prod Deployment

on:
  push:
    branches: [main]
  # Verification-only run for pull requests (#208). The QA jobs below run on both
  # events; every job that BUILDS, PUBLISHES or DEPLOYS is gated on
  # `github.event_name == 'push'`, so a pull request can never push an image or
  # touch the prod host. Before this, a PR was checked by CodeQL alone and the
  # first CI evaluation of correctness happened on `main` — i.e. on the branch
  # that deploys to production.
  pull_request:
    branches: [main]

# Serialize deploys: two pushes to `main` in quick succession must NOT run
# overlapping pipelines that race on the shared container-registry tags
# (`latest`/prod). `cancel-in-progress: false` queues a newer run behind the
# running one instead of aborting a half-published deploy, so the newest commit
# is always published last (#147).
concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Container registry + image org/name. Defaults keep the canonical repo publishing
  # to ghcr.io/<owner>/<repo>. A forker overrides these via repository variables
  # (Settings → Secrets and variables → Actions → Variables): set REGISTRY and/or
  # IMAGE_NAME to retarget the publish without editing this workflow.
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # ============================================
  # BACKEND QA
  # ============================================
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          bash scripts/patch_linkedin.sh
          pip install -r requirements-dev.txt
      - name: Run Ruff (lint)
        working-directory: ./backend
        run: ruff check . --output-format=github
      - name: Run Ruff (format check)
        working-directory: ./backend
        run: ruff format . --check

  backend-type-check:
    name: Backend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          bash scripts/patch_linkedin.sh
          pip install -r requirements-dev.txt
      - name: Run MyPy
        working-directory: ./backend
        run: mypy app --ignore-missing-imports --no-error-summary

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          bash scripts/patch_linkedin.sh
          pip install -r requirements-dev.txt
      - name: Run Bandit (security)
        working-directory: ./backend
        run: bandit -r app -ll --skip B101

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-type-check, backend-security]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_mavrov
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          bash scripts/patch_linkedin.sh
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_mavrov
          SECRET_KEY: test-secret-key-for-ci
          OLLAMA_BASE_URL: http://localhost:11434
          # Rule 10 (#141): explicit, not safe-by-absence. The job was relying on
          # the runner simply not having this variable; state it so the guarantee
          # survives someone adding a repo-level env or variable later.
          HIREFOLIO_GEMINI_API_KEY: ""
        run: |
          # --cov-fail-under=100 makes the project's stated coverage standard an
          # actual gate: without it CI printed the percentage and passed regardless,
          # so a drop below 100% only ever surfaced in a local run (review of #194).
          pytest -n auto -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=100
          # Agent-playbook drift check (#115): the single test file only — the
          # rest of agents/tests needs the a2a dependencies, not installed here.
          # No DB, no coverage; a drift between agents/PLAYBOOK.md, roster.py
          # and the .claude/agents charters fails this job.
          (cd .. && python -m pytest agents/tests/test_playbook_sync.py -q --no-header -p no:cacheprovider --no-cov)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./backend/coverage.xml
          flags: backend

  backend-migrations:
    name: Backend Migrations (drift guard)
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-type-check, backend-security]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mavrov_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          bash scripts/patch_linkedin.sh
          pip install -r requirements-dev.txt
      - name: Create a second database (to simulate the pre-Alembic prod state)
        working-directory: ./backend
        run: |
          python -c "
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect(
                  'postgresql://postgres:postgres@localhost:5432/mavrov_migrations'
              )
              await conn.execute('CREATE DATABASE mavrov_migrations_pre')
              await conn.close()

          asyncio.run(main())
          "
      - name: Simulate today's prod DB (tables via create_all, no alembic_version)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mavrov_migrations_pre
          SECRET_KEY: test-secret-key-for-ci
        run: |
          python -c "
          import asyncio
          import app.models  # noqa: F401
          from app.database import Base, engine
          from sqlalchemy import text

          async def create():
              async with engine.begin() as conn:
                  await conn.execute(text('CREATE EXTENSION IF NOT EXISTS vector'))
                  await conn.run_sync(Base.metadata.create_all)
              await engine.dispose()

          asyncio.run(create())
          "
      - name: Self-adopt the pre-Alembic DB via the real entrypoint (must NOT crash)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mavrov_migrations_pre
          SECRET_KEY: test-secret-key-for-ci
        run: ./docker-entrypoint.sh true
      - name: Verify the pre-Alembic DB is now stamped at head
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mavrov_migrations_pre
          SECRET_KEY: test-secret-key-for-ci
        run: alembic current | grep -q "(head)"
      - name: Re-run entrypoint on the now-managed pre-Alembic DB (idempotent)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mavrov_migrations_pre
          SECRET_KEY: test-secret-key-for-ci
        run: ./docker-entrypoint.sh true
      - name: Self-adopt a fresh, empty DB via the real entrypoint
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mavrov_migrations
          SECRET_KEY: test-secret-key-for-ci
        run: ./docker-entrypoint.sh true
      - name: Re-run entrypoint on the now-managed fresh DB (idempotent)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mavrov_migrations
          SECRET_KEY: test-secret-key-for-ci
        run: ./docker-entrypoint.sh true
      - name: Drift guard (models vs. migrations must match exactly)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mavrov_migrations
          SECRET_KEY: test-secret-key-for-ci
        run: alembic check
  # ============================================
  # FRONTEND QA
  # ============================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint --if-present

  # --- Frontend unit tests, one job per workspace project (parallel, legible per-app) ---
  frontend-shared-tests:
    name: Frontend Tests · Shared Library
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps
      - name: Test shared library (100% coverage)
        working-directory: ./frontend
        run: npm run test:coverage:shared
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./frontend/coverage/shared/lcov.info
          flags: frontend-shared
          fail_ci_if_error: false

  frontend-public-tests:
    name: Frontend Tests · Public App (SSR)
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps
      - name: Test public app (100% coverage)
        working-directory: ./frontend
        run: npm run test:coverage:public
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./frontend/coverage/public/lcov.info
          flags: frontend-public
          fail_ci_if_error: false

  frontend-admin-tests:
    name: Frontend Tests · Admin App (SPA)
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps
      - name: Test admin app (100% coverage)
        working-directory: ./frontend
        run: npm run test:coverage:admin
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./frontend/coverage/admin/lcov.info
          flags: frontend-admin
          fail_ci_if_error: false

  # ============================================
  # REPO QA
  # ============================================
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    # Fast gate (#193): every version carrier must agree with VERSION before
    # anything is built or published. Previously `--check` ran only in the
    # machine-local pre-push hook, so a hook-bypassing push could reintroduce
    # #172-class drift (e.g. a stale shared/package.json) and it would only
    # surface at deploy time.
    #
    # No language setup step is needed — `--check` is pure shell, and the
    # self-test's rotation cases need `npm`, which ubuntu-latest ships
    # preinstalled (the self-test fails loudly if it is ever missing).
    steps:
      - uses: actions/checkout@v7
      - name: Check version carriers agree
        run: ./bump_version.sh --check
      - name: Self-test the checker itself
        run: bash test-bump-version.sh

  # ============================================
  # PROXY QA
  # ============================================
  proxy-config-audit:
    name: Proxy Config Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for forbidden legacy configurations
        run: |
          if grep -iE "roundcube|mailserver|webmail" proxy/default.conf.template; then
            echo "Error: Forbidden legacy configuration (roundcube/mailserver/webmail) found in proxy/default.conf.template"
            exit 1
          fi
          echo "Proxy config is clean of legacy terms."

  # ============================================
  # BUILD ARTIFACTS (Parallel Builds)
  # ============================================
  build-backend:
    name: Build Backend Image
    # Build/publish/deploy: push to `main` only, never on a pull request (#208).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend-tests, backend-migrations, version-consistency]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Public Frontend Image
    # Build/publish/deploy: push to `main` only, never on a pull request (#208).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [frontend-shared-tests, frontend-public-tests, version-consistency]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build & Push Frontend (public SSR app)
      - name: Build and Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-admin-frontend:
    name: Build Admin Frontend Image
    # Build/publish/deploy: push to `main` only, never on a pull request (#208).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [frontend-shared-tests, frontend-admin-tests, version-consistency]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build & Push Admin Frontend (CSR-only SPA)
      - name: Build and Push Admin Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.admin
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-admin-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-proxy:
    name: Build Proxy Image
    # Build/publish/deploy: push to `main` only, never on a pull request (#208).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [proxy-config-audit, version-consistency]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # Build & Push Proxy
      - name: Build and Push Proxy
        uses: docker/build-push-action@v7
        with:
          context: ./proxy
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-proxy:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # E2E TESTS (Test What You Fly)
  # ============================================
  e2e-tests:
    name: E2E Tests (Docker Stack)
    # Build/publish/deploy: push to `main` only, never on a pull request (#208).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-admin-frontend, build-proxy]
    steps:
      - uses: actions/checkout@v7

      - name: Map admin.localhost to loopback (admin E2E)
        run: echo "127.0.0.1 admin.localhost" | sudo tee -a /etc/hosts

      - name: Prune Pre-Run (Free Space)
        run: |
          docker system prune -a -f --volumes
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Full Stack (Prod Topology)
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mavrov
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: sha-${{ github.sha }}
          # SECURITY / COST: never inject the real Gemini key into the ephemeral E2E
          # test stack. The admin AI-suggestion E2E specs drive `/posts/suggest-*`, which
          # with a real key call the paid Gemini API on EVERY pipeline run (unbounded cost).
          # With an empty key the backend falls back to the local Ollama in the stack
          # (free), so the E2E still exercises the flow at zero cost. The E2E specs also
          # mock these endpoints as defense-in-depth. Real prod gets its key from the host
          # env, NOT from CI.
          HIREFOLIO_GEMINI_API_KEY: ""
          # Admin E2E hits admin.localhost through the Docker bridge (source IP is the
          # gateway, not loopback, and no X-Forwarded-For is set so real_ip can't recover
          # a real client), so open the allowlist for the test run only. The prod default
          # ships CLOSED (empty ADMIN_ALLOWED_CIDRS -> loopback only) — see #86 /
          # proxy/admin_allowlist.conf. This value is test-scoped, never a real secret.
          ADMIN_ALLOWED_CIDRS: 0.0.0.0/0
          # SECURITY (issue #177): prod REQUIRES an explicit JWT_SECRET_KEY (the
          # backend refuses to start otherwise, so a known default can never sign
          # admin tokens). The ephemeral E2E stack must not be handed a real
          # secret, so it opts into a random per-process signing key instead —
          # test-scoped, nothing committed, nothing injected from secrets.
          JWT_ALLOW_EPHEMERAL_SECRET: "true"
        run: |
          # Start stack
          docker compose -f docker-compose.prod.yml up -d

      - name: Set up Node.js (for Playwright)
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps

      - name: Get installed Playwright version
        id: playwright-version
        working-directory: ./frontend
        run: |
          PW_VERSION=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)
          echo "version=$PW_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v6
        with:
          path: ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install --with-deps

      # NOTE (#134): the former "Restore cached base images" / "Load or pull base
      # images" steps were removed here as dead weight. They ran AFTER "Start Full
      # Stack" (`docker compose up -d` already pulls every image the stack needs),
      # so the ~5 GB tarball restore + `docker load` (~2 min on cache hit, ~10 min
      # on a cache miss: pull + `docker save` + post-job cache upload) sped up
      # nothing — and the tar even pinned an open-webui version the stack no longer
      # uses. Base-image pins live in docker-compose.prod.yml (single source of
      # truth). See also lessons-learned #5: multi-GB actions/cache is net-negative.

      - name: Wait for Stack Ready
        run: |
          echo "Waiting for proxy to respond on port 80..."
          # 180s (was 60s): removing the dead base-image cache steps also removed
          # ~2 min of incidental slack between `compose up -d` and this check.
          # Compose only gates on service_healthy for db/ollama — the app services
          # are bare depends_on, so this loop is now the real readiness buffer.
          timeout 180s bash -c 'until curl -s -o /dev/null -w "%{http_code}" http://localhost:80 | grep "200\|302"; do sleep 2; done'
          echo "Stack is up!"

      # Proxy smoke check — folded in from the former standalone "Proxy
      # Verification" job (removed as a redundant second stack bring-up). The
      # full stack above already proves the proxy serves HTTP 200/302 on :80
      # (a stronger check); here we additionally assert the container is up and
      # Nginx logged its start banner, preserving the old job's exact guarantee.
      - name: Verify Proxy Startup (Smoke)
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' global_proxy)" != "true" ]; then
            echo "❌ Proxy container died!"
            docker logs global_proxy
            exit 1
          fi
          LOGS=$(docker logs global_proxy 2>&1)
          echo "=== PROXY LOGS ==="
          echo "$LOGS"
          if echo "$LOGS" | grep -q "Starting Nginx..."; then
            echo "✅ Nginx started"
          else
            echo "❌ Nginx start log missing"
            exit 1
          fi

      - name: Seed E2E Data
        run: |
          docker compose -f docker-compose.prod.yml exec -T backend python scripts/seed_e2e_user.py

      # E2E is split by app so the two flows are legible in the run log.
      # Both target the same running proxy: public on http://localhost:80,
      # admin on http://admin.localhost (mapped to loopback above).
      - name: E2E · Public Site
        working-directory: ./frontend
        env:
          BASE_URL: http://localhost:80
          ADMIN_BASE_URL: http://admin.localhost
        run: npx playwright test --project=public-e2e

      - name: E2E · Admin Console
        working-directory: ./frontend
        env:
          BASE_URL: http://localhost:80
          ADMIN_BASE_URL: http://admin.localhost
        run: npx playwright test --project=admin-e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================
  # PUBLISH ARTIFACTS (Split for Visibility)
  # ============================================
  publish-backend:
    name: Publish Backend
    # Build/publish/deploy: push to `main` only, never on a pull request (#208).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Promote Backend Image
        run: |
          REPO_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA_TAG=$REPO_BASE-backend:sha-${{ github.sha }}
          VERSION=${{ steps.get_version.outputs.version }}

          docker pull $SHA_TAG
          docker tag $SHA_TAG $REPO_BASE-backend:latest
          docker tag $SHA_TAG $REPO_BASE-backend:$VERSION
          docker push $REPO_BASE-backend:latest
          docker push $REPO_BASE-backend:$VERSION

  publish-frontend:
    name: Publish Frontend
    # Build/publish/deploy: push to `main` only, never on a pull request (#208).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Promote Frontend Image
        run: |
          REPO_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA_TAG=$REPO_BASE-frontend:sha-${{ github.sha }}
          VERSION=${{ steps.get_version.outputs.version }}

          docker pull $SHA_TAG
          docker tag $SHA_TAG $REPO_BASE-frontend:latest
          docker tag $SHA_TAG $REPO_BASE-frontend:$VERSION
          docker push $REPO_BASE-frontend:latest
          docker push $REPO_BASE-frontend:$VERSION

  publish-admin-frontend:
    name: Publish Admin Frontend
    # Build/publish/deploy: push to `main` only, never on a pull request (#208).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Promote Admin Frontend Image
        run: |
          REPO_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA_TAG=$REPO_BASE-admin-frontend:sha-${{ github.sha }}
          VERSION=${{ steps.get_version.outputs.version }}

          docker pull $SHA_TAG
          docker tag $SHA_TAG $REPO_BASE-admin-frontend:latest
          docker tag $SHA_TAG $REPO_BASE-admin-frontend:$VERSION
          docker push $REPO_BASE-admin-frontend:latest
          docker push $REPO_BASE-admin-frontend:$VERSION

  publish-proxy:
    name: Publish Proxy
    # Build/publish/deploy: push to `main` only, never on a pull request (#208).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project version
        id: get_version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Promote Proxy Image
        run: |
          REPO_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA_TAG=$REPO_BASE-proxy:sha-${{ github.sha }}
          VERSION=${{ steps.get_version.outputs.version }}

          docker pull $SHA_TAG
          docker tag $SHA_TAG $REPO_BASE-proxy:latest
          docker tag $SHA_TAG $REPO_BASE-proxy:$VERSION
          docker push $REPO_BASE-proxy:latest
          docker push $REPO_BASE-proxy:$VERSION


  # ============================================
  # ROLLOUT TO PROD HOST (opt-in via secrets)
  # ============================================
  # Closes the "published ≠ live" gap (#112/#156). Deploys the IMMUTABLE
  # sha-<gitsha> tag (review #175: a mutable version tag made rollback a no-op),
  # scopes pull/up to the four app services so the DB/ollama/open-webui images
  # and volumes are never rolled by CI (#123-class drift; rule 9), verifies the
  # running containers by image digest, health-gates, freshness-probes (#169),
  # and rolls back to the previously recorded sha tag on failure. No-op until
  # the owner adds DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY (docs/DEPLOYMENT.md).
  deploy:
    name: Roll Out To Prod Host
    # Build/publish/deploy: push to `main` only, never on a pull request (#208).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [publish-backend, publish-frontend, publish-admin-frontend, publish-proxy]
    env:
      APP_SERVICES: backend frontend admin-frontend proxy
    steps:
      - uses: actions/checkout@v7

      - name: Check rollout secrets
        id: gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Rollout skipped::DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY not configured — images are published but NOT rolled onto a host (see docs/DEPLOYMENT.md)."
          fi

      - name: Set up SSH
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # TOFU on first contact; keyscan failure is loud, and once a key is
          # recorded in this run, a mismatch aborts (StrictHostKeyChecking below).
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          {
            echo "Host prod"
            echo "  HostName $DEPLOY_HOST"
            echo "  Port $DEPLOY_SSH_PORT"
            echo "  User ${{ secrets.DEPLOY_USER }}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
          } >> ~/.ssh/config

      - name: Preflight — images must be anonymously pullable
        if: steps.gate.outputs.enabled == 'true'
        env:
          SHA_TAG: sha-${{ github.sha }}
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          # The prod host pulls WITHOUT a docker login, so every app image must be
          # public. Newly created GHCR packages default to PRIVATE and visibility
          # does NOT follow a repository rename (#88/#189) — check before touching
          # the host so this surfaces as an actionable message, not a mid-rollout
          # denial. Fix: make the four packages public once, under
          # https://github.com/users/<owner>/packages (see docs/DEPLOYMENT.md).
          fail=0
          for svc in backend frontend admin-frontend proxy; do
            repo="${IMAGE_NAME}-$svc"
            token=$(curl -s "https://ghcr.io/token?scope=repository:${repo}:pull" | python3 -c "import json,sys; print(json.load(sys.stdin).get('token',''))" || true)
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${SHA_TAG}")
            if [ "$code" != "200" ]; then
              echo "::error title=Image not anonymously pullable::${IMAGE_REPO}-$svc:${SHA_TAG} returned HTTP $code. Make the GHCR package public (Packages → $repo → Package settings → Change visibility), then re-run."
              fail=1
            else
              echo "OK: ${IMAGE_REPO}-$svc:${SHA_TAG}"
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Roll out validated images
        if: steps.gate.outputs.enabled == 'true'
        id: rollout
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/mavrov.de' }}
          SHA_TAG: sha-${{ github.sha }}
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          echo "mutated=true" >> "$GITHUB_OUTPUT"
          ssh prod "DEPLOY_DIR='$DEPLOY_DIR' SHA_TAG='$SHA_TAG' IMAGE_REPO='$IMAGE_REPO' APP_SERVICES='$APP_SERVICES' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077
          cd "$DEPLOY_DIR"
          # A stale .env.rollback from an earlier run would make the rollback
          # step roll a healthy prod one deploy backwards if this run aborts
          # before mutating anything — start from a clean slate.
          rm -f .env.rollback
          # .env holds every prod secret. Refuse to touch it unless it is a
          # readable file, and never install a rewrite that lost lines — a
          # swallowed grep failure (unreadable/root-owned .env) would otherwise
          # replace the whole file with just the two image lines and destroy
          # POSTGRES_PASSWORD / JWT_SECRET_KEY / ADMIN_PASSWORD.
          if [ ! -f .env ] || [ ! -r .env ]; then
            echo "FATAL: $DEPLOY_DIR/.env is missing or unreadable by $(id -un) — refusing to roll out." >&2
            exit 1
          fi
          before=$(grep -c '' .env || true)
          if [ "${before:-0}" -lt 1 ]; then
            echo "FATAL: $DEPLOY_DIR/.env is empty — refusing to roll out." >&2
            exit 1
          fi
          # Record ONLY the previous image coordinates for rollback — never a
          # full copy of .env.
          { grep '^IMAGE_TAG=' .env || true; grep '^IMAGE_REPO=' .env || true; } > .env.rollback
          grep -v -e '^IMAGE_TAG=' -e '^IMAGE_REPO=' .env > .env.new || true
          kept=$(grep -c '' .env.new)
          # Every non-coordinate line must survive (at most 2 lines dropped).
          if [ "$((before - kept))" -gt 2 ]; then
            echo "FATAL: .env rewrite would drop $((before - kept)) lines (before=$before kept=$kept) — aborting, .env untouched." >&2
            rm -f .env.new
            exit 1
          fi
          # Immutable coordinate: rollback to the previous sha tag is meaningful,
          # unlike a mutable version tag that both runs would resolve identically.
          printf 'IMAGE_REPO=%s\nIMAGE_TAG=%s\n' "$IMAGE_REPO" "$SHA_TAG" >> .env.new
          cp -a .env .env.bak.$$ && mv .env.new .env && rm -f .env.bak.$$
          chmod 600 .env
          # Only the four app images: db/ollama/open-webui images + volumes are
          # never rolled by CI (rule 9 / #123 schema-drift class).
          docker compose -f docker-compose.prod.yml pull $APP_SERVICES
          docker compose -f docker-compose.prod.yml up -d --no-deps $APP_SERVICES
          # Digest verification: each app container must run the image the tag
          # resolves to — this, not a version string, proves freshness.
          for svc in $APP_SERVICES; do
            want=$(docker image inspect --format '{{.Id}}' "$IMAGE_REPO-$svc:$SHA_TAG")
            got=$(docker inspect --format '{{.Image}}' "$(docker compose -f docker-compose.prod.yml ps -q "$svc")")
            if [ "$want" != "$got" ]; then
              echo "Digest mismatch for $svc: running $got, expected $want" >&2
              exit 1
            fi
          done
          echo "All app services run the sha-tagged images."
          REMOTE

      - name: Health + freshness gate
        if: steps.gate.outputs.enabled == 'true'
        env:
          PUBLIC_URL: ${{ secrets.DEPLOY_PUBLIC_URL || 'https://mavrov.de' }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/mavrov.de' }}
        run: |
          echo "Waiting for $PUBLIC_URL to become healthy..."
          ok=false
          for i in $(seq 1 30); do
            if curl -s -m 10 "$PUBLIC_URL/api/app/health" | grep -q healthy; then ok=true; break; fi
            echo "  health attempt $i/30"; sleep 10
          done
          $ok || { echo "Health gate FAILED"; exit 1; }
          # Freshness probe (#169) with its own retries: the public host must NOT
          # serve the admin SPA route — 404 proves a post-workspace-split build.
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$PUBLIC_URL/admin/login" || echo 000)
            if [ "$code" = "404" ]; then
              echo "Freshness probe OK."
              # Deploy succeeded: drop the rollback marker so nothing later can
              # roll this healthy release backwards.
              ssh prod "rm -f '${DEPLOY_DIR:-/opt/mavrov.de}/.env.rollback'" || true
              exit 0
            fi
            echo "  freshness attempt $i/6: /admin/login -> $code (want 404)"; sleep 10
          done
          echo "Freshness probe FAILED"; exit 1

      - name: Roll back on failure
        if: failure() && steps.rollout.outputs.mutated == 'true'
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/mavrov.de' }}
        run: |
          echo "Rolling back to previous image coordinates..."
          ssh prod "DEPLOY_DIR='$DEPLOY_DIR' APP_SERVICES='$APP_SERVICES' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077
          cd "$DEPLOY_DIR"
          if [ -s .env.rollback ] && [ -f .env ] && [ -r .env ]; then
            # .env.rollback holds only the previous IMAGE_REPO/IMAGE_TAG lines.
            before=$(grep -c '' .env)
            grep -v -e '^IMAGE_TAG=' -e '^IMAGE_REPO=' .env > .env.new || true
            kept=$(grep -c '' .env.new)
            if [ "$((before - kept))" -gt 2 ]; then
              echo "FATAL: rollback rewrite would drop $((before - kept)) lines — aborting, .env untouched." >&2
              rm -f .env.new
              exit 1
            fi
            cat .env.rollback >> .env.new
            cp -a .env .env.bak.$$ && mv .env.new .env && rm -f .env.bak.$$
            chmod 600 .env
            rm -f .env.rollback
            docker compose -f docker-compose.prod.yml pull $APP_SERVICES
            docker compose -f docker-compose.prod.yml up -d --no-deps $APP_SERVICES
            echo "Rolled back."
          else
            echo "No usable .env.rollback, or .env is missing/unreadable — manual intervention required." >&2
            exit 1
          fi
          REMOTE
