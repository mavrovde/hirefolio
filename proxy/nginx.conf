user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Real-client-IP recovery. Regenerated at container start by entrypoint.sh
    # (generate-admin-config.sh) from TRUSTED_PROXY_CIDRS / REAL_IP_HEADER; the
    # committed proxy/real_ip.conf is the safe default + fallback. Must load
    # before log_format is applied so $remote_addr logs the real client IP.
    include /etc/nginx/real_ip.conf;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    aio             off; # Explicitly disable asynchronous file I/O to avoid io_setup() fails on macOS arm64
    directio        off; # Ensure direct I/O is also off, which can trigger AIO

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
