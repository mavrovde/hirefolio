# Admin access allowlist (included inside the admin server block).
#
# This file is a SAFE, CLOSED default. At container start /entrypoint.sh REGENERATES
# it from the ADMIN_ALLOWED_CIDRS environment variable (space/comma separated). When
# that variable is empty the admin surface is closed to everything except loopback
# (which the server block itself always allows for CI/E2E and on-box checks).
#
# To grant trusted operator IPs, set ADMIN_ALLOWED_CIDRS in the root .env, e.g.:
#   ADMIN_ALLOWED_CIDRS="203.0.113.7 198.51.100.0/24"
# Never use 0.0.0.0/0 in production — that re-opens the admin console to the world.
deny all;
