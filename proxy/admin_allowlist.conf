# Admin access allowlist (included inside the admin.mavrov.de server block).
#
# The admin console is a restricted surface. Loopback is always allowed by the
# server block itself (so CI/E2E and on-box checks work). Add the real admin
# operator IP/CIDRs below and keep the final `deny all;` to lock the subdomain
# down in production. Left permissive by default so a fresh deploy is reachable;
# TIGHTEN THIS before exposing admin.mavrov.de publicly.
allow all;
# Example hardened form:
#   allow 203.0.113.7;      # office / VPN egress
#   allow 198.51.100.0/24;
#   deny all;
