# Admin access allowlist (included inside the admin server block, after the
# loopback allows).
#
# This committed file is a SAFE, CLOSED default. At container start
# /entrypoint.sh REGENERATES it (via generate-admin-config.sh) from the
# ADMIN_ALLOWED_CIDRS environment variable (space/comma separated). When that
# variable is empty the admin surface is closed to everything except loopback
# — which the server block itself always allows (127.0.0.1 / ::1) so on-box /
# CI checks work. It also serves as the fallback if the generated config fails
# `nginx -t`.
#
# To grant trusted operator IPs, set ADMIN_ALLOWED_CIDRS in the root .env, e.g.:
#   ADMIN_ALLOWED_CIDRS="203.0.113.7 198.51.100.0/24"
# This is only effective once real_ip is trusting your front proxy (see
# proxy/real_ip.conf + TRUSTED_PROXY_CIDRS) so $remote_addr is the real client.
# Never use 0.0.0.0/0 in production — that re-opens the admin console to the world.
deny all;
