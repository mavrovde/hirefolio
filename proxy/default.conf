# Default block to reject unknown hostnames
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    # Open WebUI subpath for local access - PRIORITIZED
    location ^~ /open/ {
        proxy_pass http://open-webui:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
    }

    # Redirect /open to /open/ for local access
    location = /open {
        return 301 $scheme://$http_host/open/;
    }

    # Open WebUI Path Shifting (Fix for subpath asset loading)
    location /_app/ {
        proxy_pass http://open-webui:8080/_app/;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location /static/ {
        proxy_pass http://open-webui:8080/static/;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location /manifest.json {
        proxy_pass http://open-webui:8080/manifest.json;
        proxy_set_header Host $host;
    }

    location /api/v1/ {
        proxy_pass http://open-webui:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # App API shifted to /api/app/ to avoid conflict with Open WebUI /api/v1/
    location /api/app/ {
        proxy_pass http://backend:8000/api/app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
        
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    # Default to frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name mavrov.de www.mavrov.de;

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mavrov.de www.mavrov.de;

    # SSL Certificates
    ssl_certificate /etc/nginx/ssl/mavrov.de.bundle.cer;
    ssl_certificate_key /etc/nginx/ssl/mavrov.de.key;
    
    # Recommended SSL parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_ecdh_curve secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Increase body size
    client_max_body_size 50M;

    # Open WebUI subpath - PRIORITIZED
    location ^~ /open/ {
        proxy_pass http://open-webui:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
    }

    # Redirect /open to /open/
    location = /open {
        return 301 $scheme://$http_host/open/;
    }

    # Open WebUI Path Shifting (Fix for subpath asset loading)
    location /_app/ {
        proxy_pass http://open-webui:8080/_app/;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location /static/ {
        proxy_pass http://open-webui:8080/static/;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location /manifest.json {
        proxy_pass http://open-webui:8080/manifest.json;
        proxy_set_header Host $host;
    }

    location /api/v1/ {
        proxy_pass http://open-webui:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Main Site & API
    location / {
        # Check if it's the specific app API path
        location /api/app/ {
            proxy_pass http://backend:8000/api/app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
    }
}
