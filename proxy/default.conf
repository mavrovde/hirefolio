# Default reject unknown hosts (HTTP)
server {
    listen 80 default_server;
    server_name _;
    return 444; # Connection Closed Without Response
}

# HTTP to HTTPS redirect for mavrov.de
server {
    listen 80;
    server_name mavrov.de www.mavrov.de;
    return 301 https://$host$request_uri;
}

# Main Application Server
server {
    listen 80; # For localhost
    listen 443 ssl;
    server_name mavrov.de www.mavrov.de localhost 127.0.0.1;

    # SSL Certificates (Provided by 1panel in prod or dummy certs in CI/local)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Health Check -> Backend
    location /health {
        proxy_pass http://backend:8000/api/app/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Open WebUI
    location /open/ {
        proxy_pass http://open-webui:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/app/ {
        proxy_pass http://backend:8000/api/app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
