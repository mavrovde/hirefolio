# Default reject unknown hosts (HTTP)
server {
    listen 80 default_server;
    server_name _;
    return 444; # Connection Closed Without Response
}

# Production Domain & Localhost (HTTP)
server {
    listen 80;
    listen 443;
    server_name mavrov.de localhost 127.0.0.1;

    # Note: SSL terminates externally, no internal certs provided here.

    # Health Check -> Backend
    location /health {
        proxy_pass http://backend:8000/api/app/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Open WebUI
    location /open/ {
        proxy_pass http://open-webui:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/app/ {
        proxy_pass http://backend:8000/api/app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
