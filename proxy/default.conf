# Default block to reject unknown hostnames
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name mavrov.de www.mavrov.de;


    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mavrov.de www.mavrov.de;

    # SSL Certificates
    ssl_certificate /etc/nginx/ssl/mavrov.de.bundle.cer;
    ssl_certificate_key /etc/nginx/ssl/mavrov.de.key;
    
    # Recommended SSL parameters (hardcoded for simplicity since certbot is gone)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_ecdh_curve secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Increase body size
    client_max_body_size 50M;

    # Open WebUI (AI) subpath
    location /ai/ {
        proxy_pass http://open-webui:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Redirect /ai to /ai/
    location = /ai {
        return 301 $scheme://$http_host/ai/;
    }

    # Main Site & API
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
    }
}
