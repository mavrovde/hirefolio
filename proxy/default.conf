# Default reject unknown hosts (HTTP)
server {
    listen 80 default_server;
    server_name _;
    return 444; # Connection Closed Without Response
}

# Default reject unknown hosts (HTTPS)
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/ssl/mavrov.de.bundle.cer;
    ssl_certificate_key /etc/nginx/ssl/mavrov.de.key;
    return 444;
}

# Localhost (HTTP) - For verification script (Tests 1 & 2)
server {
    listen 80;
    server_name localhost 127.0.0.1;


    # Health Check -> Backend
    location /health {
        proxy_pass http://backend:8000/api/app/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Open WebUI
    location /open/ {
        proxy_pass http://open-webui:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/app/ {
        proxy_pass http://backend:8000/api/app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Production Domain (HTTP) -> Redirect (Test 3)
server {
    listen 80;
    server_name mavrov.de;
    return 301 https://$host$request_uri;
}

# Production Domain & Localhost (HTTPS) - (Tests 4-6)
# We include localhost here to support https://localhost requests if valid certs exist
server {
    listen 443 ssl;
    server_name mavrov.de localhost 127.0.0.1;

    ssl_certificate /etc/nginx/ssl/mavrov.de.bundle.cer;
    ssl_certificate_key /etc/nginx/ssl/mavrov.de.key;


    # Health Check -> Backend
    location /health {
        proxy_pass http://backend:8000/api/app/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Open WebUI
    location /open/ {
        proxy_pass http://open-webui:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/app/ {
        proxy_pass http://backend:8000/api/app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
