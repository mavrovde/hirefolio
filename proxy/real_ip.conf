# Real-client-IP trust config (included in the http context by nginx.conf).
#
# This committed file is a SAFE DEFAULT. At container start /entrypoint.sh
# REGENERATES it (via generate-admin-config.sh) from TRUSTED_PROXY_CIDRS /
# REAL_IP_HEADER. It also serves as the fallback if the generated config fails
# `nginx -t`, so the image always has a valid file to include.
#
# In the containerized topology admin traffic reaches nginx via the Docker bridge
# gateway (Docker NAT masks the external source IP), so without this every client
# looks like the gateway. Trusting the upstream CIDR and reading X-Forwarded-For
# restores the real client IP for the admin allow/deny rules and access logs.
# Only trust CIDRs you control — a trusted source can spoof X-Forwarded-For.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
